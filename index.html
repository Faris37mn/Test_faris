<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Aziera.</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            color: #ffffff;
            padding-bottom: 40px;
            position: relative;
        }

        /* Floating Background Hearts */
        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .floating-heart {
            position: absolute;
            bottom: -20px;
            background: rgba(255, 51, 102, 0.4);
            transform: rotate(-45deg);
            border-radius: 50% 50% 0 0;
            animation: floatUp 6s infinite ease-in-out;
        }

        .floating-heart::before,
        .floating-heart::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: inherit;
            border-radius: 50%;
        }

        .floating-heart::before {
            top: -50%;
            left: 0;
        }

        .floating-heart::after {
            top: 0;
            left: 50%;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(-45deg) scale(0.6);
                opacity: 0;
            }
            20% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-100vh) rotate(-45deg) scale(1.2);
                opacity: 0;
            }
        }

        /* Ensure content stays above floating hearts */
        .nav-tabs, .page {
            z-index: 10;
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 15px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: #ccc;
            padding: 10px 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: #ff3366;
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 51, 102, 0.5);
        }

        .tab-btn:hover:not(.active) {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }

        /* Page Content Containers */
        .page {
            display: none;
            width: 100%;
            max-width: 600px;
            margin-top: 50px;
            padding: 0 20px;
            animation: fadeIn 0.5s ease-in-out;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Home Page Styling */
        .home-content {
            text-align: center;
        }

        .heart {
            position: relative;
            width: 120px;
            height: 108px;
            animation: pulse 1.2s infinite ease-in-out;
            margin: 0 auto 30px auto;
        }

        .heart::before,
        .heart::after {
            content: "";
            position: absolute;
            top: 0;
            width: 70px;
            height: 110px;
            border-radius: 50px 50px 0 0;
            background: #ff3366;
            box-shadow: 0 0 30px rgba(255, 51, 102, 0.6);
        }

        .heart::before {
            left: 70px;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }

        .heart::after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            15% { transform: scale(1.15); }
            30% { transform: scale(1); }
            45% { transform: scale(1.1); }
            60% { transform: scale(1); }
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .home-content p {
            color: #e0e0e0;
            font-size: 1.1rem;
            text-shadow: 0 1px 5px rgba(0, 0, 0, 0.3);
        }

        /* Question Page Styling */
        .question-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .question-card h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #ff99bb;
            text-align: center;
        }

        .q-group {
            margin-bottom: 20px;
        }

        .q-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 1.05rem;
        }

        .q-group input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(0, 0, 0, 0.2);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .q-group input[type="text"]:focus {
            border-color: #ff3366;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .option-btn {
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        .option-btn:hover, .option-btn.selected {
            background: #ff3366;
            border-color: #ff3366;
            box-shadow: 0 0 10px rgba(255, 51, 102, 0.4);
        }

        .submit-container {
            text-align: center;
            margin-top: 25px;
        }

        .submit-btn {
            background: linear-gradient(135deg, #ff3366, #ff6699);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 51, 102, 0.4);
            transition: transform 0.2s;
        }

        .submit-btn:hover {
            transform: scale(1.05);
        }

        #thankYouMsg {
            display: none;
            text-align: center;
            font-size: 1.2rem;
            color: #99ffbb;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="floating-hearts" id="floatingHearts"></div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchPage('home')">Home</button>
        <button class="tab-btn" onclick="switchPage('questions')">Get to Know Me</button>
    </div>

    <div id="home" class="page active">
        <div class="home-content">
            <div class="heart"></div>
            <h1>Made With Love</h1>
            <p>For Aziera</p>
            <p>Welcome! Click the tab above to answer some fun questions.</p>
        </div>
    </div>

    <div id="questions" class="page">
        <div class="question-card">
            <h2>Let's Get to Know Each Other ✨</h2>
            <form id="loveForm" onsubmit="handleSubmit(event)">
                
                <div class="q-group">
                    <label>1. What is your absolute favorite comfort food?</label>
                    <input type="text" id="food" placeholder="e.g., Pizza, Ice cream, Sushi..." required>
                </div>

                <div class="q-group">
                    <label>2. Ideal weekend: Cozy night in or adventure outside?</label>
                    <div class="options-grid" id="weekendGroup">
                        <button type="button" class="option-btn" onclick="selectOption(this, 'weekend')">🏠 Cozy Night In</button>
                        <button type="button" class="option-btn" onclick="selectOption(this, 'weekend')">🌍 Outdoor Adventure</button>
                    </div>
                </div>

                <div class="q-group">
                    <label>3. What's a dream destination you want to visit?</label>
                    <input type="text" id="destination" placeholder="e.g., Japan, Paris, Swiss Alps..." required>
                </div>

                <div class="q-group">
                    <label>4. Coffee, tea, or boba?</label>
                    <div class="options-grid" id="drinkGroup">
                        <button type="button" class="option-btn" onclick="selectOption(this, 'drink')">☕ Coffee</button>
                        <button type="button" class="option-btn" onclick="selectOption(this, 'drink')">🍵 Tea / Boba</button>
                    </div>
                </div>

                <div class="q-group">
                    <label>5. If you could have any superpower, what would it be?</label>
                    <input type="text" id="superpower" placeholder="e.g., Flying, Time travel, Invisibility..." required>
                </div>

                <div class="q-group">
                    <label>6. What is your favorite thing about us / our moments together?</label>
                    <input type="text" id="memory" placeholder="e.g., When we laugh, our late talks, our dates..." required>
                </div>

                <div class="submit-container">
                    <button type="submit" class="submit-btn">Send Answers 💌</button>
                </div>
            </form>
            <div id="thankYouMsg">Yay! Thank you for sharing. I loved reading these! 🥰</div>
        </div>
    </div>

    <script>
        // ==========================================
        // REPLACE WITH YOUR SUPABASE CREDENTIALS
        // ==========================================
        const SUPABASE_URL = 'https://tcdnlolafroxgqrxgspx.supabase.co/rest/v1/';
        const SUPABASE_ANON_KEY = 'sb_publishable_Yovzd5GbJxjfua_XAtxyMw_siMWyU6N';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Store selected options values
        let selectedValues = {
            weekend: '',
            drink: ''
        };

        // Generate continuous floating hearts in the background
        function createFloatingHeart() {
            const container = document.getElementById('floatingHearts');
            if (!container) return;

            const heart = document.createElement('div');
            heart.classList.add('floating-heart');

            const size = Math.random() * 15 + 10;
            heart.style.width = `${size}px`;
            heart.style.height = `${size}px`;
            heart.style.left = `${Math.random() * 100}vw`;
            
            const duration = Math.random() * 3 + 4;
            heart.style.animationDuration = `${duration}s`;

            container.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, duration * 1000);
        }

        setInterval(createFloatingHeart, 400);

        // Function to switch between tabs
        function switchPage(pageId) {
            const pages = document.querySelectorAll('.page');
            pages.forEach(page => page.classList.remove('active'));

            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => btn.classList.remove('active'));

            document.getElementById(pageId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // Function for clickable option buttons
        function selectOption(button, category) {
            const group = button.parentElement;
            group.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('selected'));
            button.classList.add('selected');
            selectedValues[category] = button.textContent.trim();
        }

        // Handle form submission and send to Supabase
        async function handleSubmit(event) {
            event.preventDefault();

            // Collect text inputs
            const comfort_food = document.getElementById('food').value;
            const dream_destination = document.getElementById('destination').value;
            const superpower = document.getElementById('superpower').value;
            const favorite_memory = document.getElementById('memory').value;

            // Send data to Supabase table 'love_answers'
            const { data, error } = await supabaseClient
                .from('love_answers')
                .insert([
                    { 
                        comfort_food: comfort_food, 
                        weekend_preference: selectedValues.weekend, 
                        dream_destination: dream_destination, 
                        drink_choice: selectedValues.drink, 
                        superpower: superpower, 
                        favorite_memory: favorite_memory 
                    }
                ]);

            if (error) {
                console.error('Error saving answers:', error);
                alert('Oops! Something went wrong saving your answers.');
            } else {
                document.getElementById('loveForm').style.display = 'none';
                document.getElementById('thankYouMsg').style.display = 'block';
            }
        }
    </script>

</body>
</html>
