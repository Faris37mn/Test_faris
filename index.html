<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Aziera.</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            color: #ffffff;
            padding-bottom: 40px;
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 15px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: #ccc;
            padding: 10px 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: #ff3366;
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 51, 102, 0.5);
        }

        .tab-btn:hover:not(.active) {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }

        /* Page Content Containers */
        .page {
            display: none;
            width: 100%;
            max-width: 600px;
            margin-top: 50px;
            padding: 0 20px;
            animation: fadeIn 0.5s ease-in-out;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Home Page Styling */
        .home-content {
            text-align: center;
        }

        .heart {
            position: relative;
            width: 120px;
            height: 108px;
            animation: pulse 1.2s infinite ease-in-out;
            margin: 0 auto 30px auto;
        }

        .heart::before,
        .heart::after {
            content: "";
            position: absolute;
            top: 0;
            width: 70px;
            height: 110px;
            border-radius: 50px 50px 0 0;
            background: #ff3366;
            box-shadow: 0 0 30px rgba(255, 51, 102, 0.6);
        }

        .heart::before {
            left: 70px;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }

        .heart::after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            15% { transform: scale(1.15); }
            30% { transform: scale(1); }
            45% { transform: scale(1.1); }
            60% { transform: scale(1); }
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .home-content p {
            color: #e0e0e0;
            font-size: 1.1rem;
            text-shadow: 0 1px 5px rgba(0, 0, 0, 0.3);
        }

        /* Question Page Styling */
        .question-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .question-card h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #ff99bb;
            text-align: center;
        }

        .q-group {
            margin-bottom: 20px;
        }

        .q-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 1.05rem;
        }

        .q-group input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(0, 0, 0, 0.2);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .q-group input[type="text"]:focus {
            border-color: #ff3366;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .option-btn {
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        .option-btn:hover, .option-btn.selected {
            background: #ff3366;
            border-color: #ff3366;
            box-shadow: 0 0 10px rgba(255, 51, 102, 0.4);
        }

        .submit-container {
            text-align: center;
            margin-top: 25px;
        }

        .submit-btn {
            background: linear-gradient(135deg, #ff3366, #ff6699);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 51, 102, 0.4);
            transition: transform 0.2s;
        }

        .submit-btn:hover {
            transform: scale(1.05);
        }

        #thankYouMsg {
            display: none;
            text-align: center;
            font-size: 1.2rem;
            color: #99ffbb;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- Tab Navigation Bar -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchPage('home')">Home</button>
        <button class="tab-btn" onclick="switchPage('questions')">Get to Know Me</button>
    </div>

    <!-- PAGE 1: HOME -->
    <div id="home" class="page active">
        <div class="home-content">
            <div class="heart"></div>
            <h1>Made With Love</h1>
            <p>For Aziera</p>
            <p>Welcome! Click the tab above to answer some fun questions.</p>
        </div>
    </div>

    <!-- PAGE 2: QUESTIONS -->
    <div id="questions" class="page">
        <div class="question-card">
            <h2>Let's Get to Know Each Other ✨</h2>
            <form id="loveForm" onsubmit="handleSubmit(event)">
                
                <div class="q-group">
                    <label>1. What is your absolute favorite comfort food?</label>
                    <input type="text" placeholder="e.g., Pizza, Ice cream, Sushi..." required>
                </div>

                <div class="q-group">
                    <label>2. Ideal weekend: Cozy night in or adventure outside?</label>
                    <div class="options-grid">
                        <button type="button" class="option-btn" onclick="selectOption(this)">🏠 Cozy Night In</button>
                        <button type="button" class="option-btn" onclick="selectOption(this)">🌍 Outdoor Adventure</button>
                    </div>
                </div>

                <div class="q-group">
                    <label>3. What's a dream destination you want to visit?</label>
                    <input type="text" placeholder="e.g., Japan, Paris, Swiss Alps..." required>
                </div>

                <div class="q-group">
                    <label>4. Coffee, tea, or boba?</label>
                    <div class="options-grid">
                        <button type="button" class="option-btn" onclick="selectOption(this)">☕ Coffee</button>
                        <button type="button" class="option-btn" onclick="selectOption(this)">🍵 Tea / Boba</button>
                    </div>
                </div>

                <div class="q-group">
                    <label>5. If you could have any superpower, what would it be?</label>
                    <input type="text" placeholder="e.g., Flying, Time travel, Invisibility..." required>
                </div>

                <div class="submit-container">
                    <button type="submit" class="submit-btn">Send Answers 💌</button>
                </div>
            </form>
            <div id="thankYouMsg">Yay! Thank you for sharing. I loved reading these! 🥰</div>
        </div>
    </div>

    <script>
        // Function to switch between tabs
        function switchPage(pageId) {
            // Hide all pages
            const pages = document.querySelectorAll('.page');
            pages.forEach(page => page.classList.remove('active'));

            // Remove active state from all buttons
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => btn.classList.remove('active'));

            // Show target page and activate button
            document.getElementById(pageId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // Function for clickable option buttons
        function selectOption(button) {
            // Deselect siblings in the same group
            const group = button.parentElement;
            group.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('selected'));
            // Select clicked button
            button.classList.add('selected');
        }

        // Handle form submission response
        function handleSubmit(event) {
            event.preventDefault();
            document.getElementById('loveForm').style.display = 'none';
            document.getElementById('thankYouMsg').style.display = 'block';
        }
    </script>

</body>
</html>
