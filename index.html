<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Aziera.</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            color: #ffffff;
            padding-bottom: 40px;
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 15px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: #ccc;
            padding: 10px 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: #dc2626;
            color: #fff;
            box-shadow: 0 0 15px rgba(220, 38, 38, 0.6);
        }

        .tab-btn:hover:not(.active) {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }

        /* Page Content Containers */
        .page {
            display: none;
            width: 100%;
            max-width: 600px;
            margin-top: 50px;
            padding: 0 20px;
            animation: fadeIn 0.5s ease-in-out;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Home Page Styling */
        .home-content {
            text-align: center;
        }

        /* Spider-Man Mask Heart Shape */
        .heart {
            position: relative;
            width: 130px;
            height: 118px;
            animation: pulse 1.2s infinite ease-in-out;
            margin: 0 auto 30px auto;
            filter: drop-shadow(0 0 25px rgba(220, 38, 38, 0.7));
        }

        .heart::before,
        .heart::after {
            content: "";
            position: absolute;
            top: 0;
            width: 75px;
            height: 118px;
            border-radius: 60px 60px 0 0;
            background: #dc2626; /* Spider-Man Red */
        }

        .heart::before {
            left: 75px;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }

        .heart::after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }

        /* Clean Web Lines (Side Arcs Only - No Crosshair) */
        .web-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
            background-image: 
                radial-gradient(circle at 65px 25px, transparent 22px, rgba(0, 0, 0, 0.3) 23px, transparent 24px),
                radial-gradient(circle at 65px 25px, transparent 42px, rgba(0, 0, 0, 0.3) 43px, transparent 44px);
            border-radius: 20px;
        }

        /* Authentic Large Aggressive Spider-Man Eyes */
        .eye {
            position: absolute;
            background: #ffffff;
            border: 3.5px solid #000000;
            z-index: 10;
            top: 38px;
        }

        .left-eye {
            left: 24px;
            width: 38px;
            height: 24px;
            border-radius: 80% 20% 15% 70%;
            transform: rotate(-25deg);
        }

        .right-eye {
            right: 24px;
            width: 38px;
            height: 24px;
            border-radius: 20% 80% 70% 15%;
            transform: rotate(25deg);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            15% { transform: scale(1.15); }
            30% { transform: scale(1); }
            45% { transform: scale(1.1); }
            60% { transform: scale(1); }
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .home-content p {
            color: #e0e0e0;
            font-size: 1.1rem;
            text-shadow: 0 1px 5px rgba(0, 0, 0, 0.3);
        }

        /* Question Page Styling */
        .question-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .question-card h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #fca5a5;
            text-align: center;
        }

        .q-group {
            margin-bottom: 20px;
        }

        .q-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 1.05rem;
        }

        .q-group input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(0, 0, 0, 0.2);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .q-group input[type="text"]:focus {
            border-color: #dc2626;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .option-btn {
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        .option-btn:hover, .option-btn.selected {
            background: #dc2626;
            border-color: #dc2626;
            box-shadow: 0 0 10px rgba(220, 38, 38, 0.5);
        }

        .submit-container {
            text-align: center;
            margin-top: 25px;
        }

        .submit-btn {
            background: linear-gradient(135deg, #dc2626, #1e3a8a);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.4);
            transition: transform 0.2s;
        }

        .submit-btn:hover {
            transform: scale(1.05);
        }

        #thankYouMsg {
            display: none;
            text-align: center;
            font-size: 1.2rem;
            color: #86efac;
            margin-top: 20px;
        }

        /* Floating Audio Toggle Button */
        .audio-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 10px 18px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .audio-toggle:hover {
            background: #dc2626;
            border-color: #dc2626;
            box-shadow: 0 0 15px rgba(220, 38, 38, 0.6);
        }
    </style>
</head>
<body>

    <!-- Working HTML5 Audio Element with a smooth romantic instrumental link -->
    <audio id="bgAudio" loop>
        <source src="https://cdn.chosic.com/wp-content/uploads/2021/04/Warm-Memories-Emotional-Inspiring-Piano.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <!-- Floating Audio Button -->
    <button id="audioBtn" class="audio-toggle" onclick="toggleAudio()">🎵 Play Music</button>

    <!-- Tab Navigation Bar -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchPage('home')">Home</button>
        <button class="tab-btn" onclick="switchPage('questions')">Get to Know Me</button>
    </div>

    <!-- PAGE 1: HOME -->
    <div id="home" class="page active">
        <div class="home-content">
            <div class="heart">
                <div class="web-lines"></div>
                <div class="eye left-eye"></div>
                <div class="eye right-eye"></div>
            </div>
            <h1>Made With Love</h1>
            <p>For Aziera</p>
            <p>Welcome! Click the tab above to answer some fun questions.</p>
        </div>
    </div>

    <!-- PAGE 2: QUESTIONS -->
    <div id="questions" class="page">
        <div class="question-card">
            <h2>Let's Get to Know Each Other ✨</h2>
            <form id="loveForm" onsubmit="handleSubmit(event)">
                
                <div class="q-group">
                    <label>1. What is your absolute favorite comfort food?</label>
                    <input type="text" placeholder="e.g., Pizza, Ice cream, Sushi..." required>
                </div>

                <div class="q-group">
                    <label>2. Ideal weekend: Cozy night in or adventure outside?</label>
                    <div class="options-grid">
                        <button type="button" class="option-btn" onclick="selectOption(this)">🏠 Cozy Night In</button>
                        <button type="button" class="option-btn" onclick="selectOption(this)">🌍 Outdoor Adventure</button>
                    </div>
                </div>

                <div class="q-group">
                    <label>3. What's a dream destination you want to visit?</label>
                    <input type="text" placeholder="e.g., Japan, Paris, Swiss Alps..." required>
                </div>

                <div class="q-group">
                    <label>4. Coffee, tea, or boba?</label>
                    <div class="options-grid">
                        <button type="button" class="option-btn" onclick="selectOption(this)">☕ Coffee</button>
                        <button type="button" class="option-btn" onclick="selectOption(this)">🍵 Tea / Boba</button>
                    </div>
                </div>

                <div class="q-group">
                    <label>5. If you could have any superpower, what would it be?</label>
                    <input type="text" placeholder="e.g., Flying, Time travel, Invisibility..." required>
                </div>

                <div class="submit-container">
                    <button type="submit" class="submit-btn">Send Answers 💌</button>
                </div>
            </form>
            <div id="thankYouMsg">Yay! Thank you for sharing. I loved reading these! 🥰</div>
        </div>
    </div>

    <script>
        // Working Audio Toggle Logic
        function toggleAudio() {
            const audio = document.getElementById('bgAudio');
            const btn = document.getElementById('audioBtn');

            if (audio.paused) {
                audio.play().then(() => {
                    btn.textContent = "🔇 Pause Music";
                }).catch(error => {
                    console.log("Playback prevented:", error);
                });
            } else {
                audio.pause();
                btn.textContent = "🎵 Play Music";
            }
        }

        // Function to switch between tabs
        function switchPage(pageId) {
            const pages = document.querySelectorAll('.page');
            pages.forEach(page => page.classList.remove('active'));

            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => btn.classList.remove('active'));

            document.getElementById(pageId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // Function for clickable option buttons
        function selectOption(button) {
            const group = button.parentElement;
            group.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('selected'));
            button.classList.add('selected');
        }

        // Handle form submission response
        function handleSubmit(event) {
            event.preventDefault();
            document.getElementById('loveForm').style.display = 'none';
            document.getElementById('thankYouMsg').style.display = 'block';
        }
    </script>

</body>
</html>
