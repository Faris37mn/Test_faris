<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Aziera</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
        }

        /* Heart Shape Styling */
        .heart {
            position: relative;
            width: 120px;
            height: 108px;
            animation: pulse 1.2s infinite ease-in-out;
            margin: 0 auto 30px auto;
        }

        .heart::before,
        .heart::after {
            content: "";
            position: absolute;
            top: 0;
            width: 70px;
            height: 110px;
            border-radius: 50px 50px 0 0;
            background: #ff3366;
            box-shadow: 0 0 30px rgba(255, 51, 102, 0.6);
        }

        .heart::before {
            left: 70px;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }

        .heart::after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }

        /* Pulse Animation */
        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            15% {
                transform: scale(1.15);
            }
            30% {
                transform: scale(1);
            }
            45% {
                transform: scale(1.1);
            }
            60% {
                transform: scale(1);
            }
        }

        /* Text Styling */
        h1 {
            color: #ffffff;
            font-size: 2.2rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            letter-spacing: 1px;
        }

        p {
            color: #e0e0e0;
            font-size: 1.1rem;
            text-shadow: 0 1px 5px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="heart"></div>
        <h1>Made With Love</h1>
        <p>Wishing Aziera a wonderful day ahead!</p>
        <p>Aziera BB dah makan ke belum?</p>
    </div>

</body>
</html>
